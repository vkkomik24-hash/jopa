<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Смотри внимательно 👀</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; touch-action:none;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; color:#eee;
    -webkit-user-select:none; user-select:none; }
  #bait { height:100%; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(ellipse at center, #101010 0%, #000 70%); }
  .card { width:min(560px,94vw); background:#0d0d0d; border:1px solid #222; border-radius:14px;
    overflow:hidden; cursor:pointer; box-shadow:0 0 60px rgba(255,0,0,.08); }
  .thumb { position:relative; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #1b1b1b 0%, #050505 65%); }
  .play { width:92px; height:92px; border-radius:50%; background:rgba(255,255,255,.92);
    display:flex; align-items:center; justify-content:center; font-size:38px; color:#000;
    padding-left:8px; box-shadow:0 0 40px rgba(255,255,255,.25); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .rec { position:absolute; top:12px; left:14px; color:#ff3b3b; font-weight:700; font-size:14px; letter-spacing:1px; }
  .rec::before { content:''; display:inline-block; width:10px; height:10px; border-radius:50%;
    background:#ff3b3b; margin-right:7px; animation:blink 1.2s infinite; }
  @keyframes blink { 50%{opacity:.15} }
  .cam { position:absolute; bottom:12px; right:14px; color:#666; font-size:12px; letter-spacing:1px; }
  .meta { padding:16px 18px 20px; }
  .meta h1 { font-size:19px; margin-bottom:8px; }
  .meta p { font-size:14px; color:#999; line-height:1.5; }
  .meta .vol { margin-top:12px; font-size:15px; color:#ffd76a; }
  #wait { height:100%; display:flex; flex-direction:column; gap:20px; align-items:center; justify-content:center; }
  .bar { width:min(420px,80vw); height:8px; background:#1a1a1a; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0%; background:#eee; border-radius:99px; transition:width .3s; }
  #wait p { color:#777; font-size:14px; letter-spacing:2px; }
  #scare { position:fixed; inset:0; display:none; background:#000; }
  #scare canvas, #scare img.face { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #flash { position:fixed; inset:0; background:#c00; opacity:0; pointer-events:none; z-index:5; }
  body.shaking #scare { animation:violent .12s infinite; }
  @keyframes violent {
    0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(-26px,18px) rotate(-1.2deg)}
    50%{transform:translate(22px,-20px) rotate(1deg)}
    75%{transform:translate(-14px,-16px) rotate(-0.6deg)}
    100%{transform:translate(18px,14px) rotate(0.8deg)}
  }
  #after { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; background:rgba(0,0,0,.88); z-index:10; }
  #after h2 { font-size:64px; }
  #after p { color:#888; font-size:16px; }
  #after button { font-size:18px; padding:14px 38px; border-radius:999px; border:none;
    background:#fff; color:#000; font-weight:700; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="bait">
  <div class="card" id="playCard">
    <div class="thumb">
      <div class="rec">REC</div>
      <div class="play">▶</div>
      <div class="cam">CAM 04 · 03:12 AM</div>
    </div>
    <div class="meta">
      <h1>Странная запись с камеры наблюдения 😱</h1>
      <p>Смотри внимательно до конца… в конце что-то происходит.</p>
      <p class="vol">🔊 Включи звук погромче и нажми play</p>
    </div>
  </div>
</div>

<div id="wait" class="hidden">
  <div class="bar"><i id="loadbar"></i></div>
  <p>ЗАГРУЗКА ВИДЕО…</p>
</div>

<div id="scare"><canvas id="cv"></canvas></div>
<div id="flash"></div>

<div id="after">
  <h2>БУ! 👹</h2>
  <p>Попался 😈 Отправь другу, пусть тоже «посмотрит»</p>
  <button id="again">Ещё раз</button>
</div>

<script>
(function(){
  "use strict";
  document.addEventListener('contextmenu', e => e.preventDefault());

  var bait = document.getElementById('bait'),
      wait = document.getElementById('wait'),
      scare = document.getElementById('scare'),
      flash = document.getElementById('flash'),
      after = document.getElementById('after'),
      bar = document.getElementById('loadbar'),
      cv = document.getElementById('cv'),
      ctx = cv.getContext('2d');

  function sizeCanvas(){
    cv.width = window.innerWidth; cv.height = window.innerHeight;
  }
  window.addEventListener('resize', sizeCanvas); sizeCanvas();

  // Optional: if the owner drops their own face.jpg next to index.html, it will be used.
  var faceImg = null;
  var probe = new Image();
  probe.onload = function(){ faceImg = probe; };
  probe.src = 'face.jpg';

  var actx = null, ambientNodes = null;

  function startAmbient(){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      // barely-audible creepy rumble — the victim turns the volume UP :)
      var o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = 48;
      var g = actx.createGain(); g.gain.value = 0.045;
      var lfo = actx.createOscillator(); lfo.frequency.value = 0.13;
      var lg = actx.createGain(); lg.gain.value = 0.025;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(actx.destination);
      o.start(); lfo.start();
      ambientNodes = [o, lfo];
    }catch(e){}
  }
  function stopAmbient(){
    if (ambientNodes){ try{ ambientNodes.forEach(function(n){ n.stop(); }); }catch(e){} ambientNodes = null; }
  }

  // MAXIMUM LOUDNESS blast, 100% synthesized: noise burst + vocal-like shriek
  // (bandpassed noise sweeping down) + distorted pitch-dropping saws + sub punch
  function blast(){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime, dur = 3.2;
      var buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++){
        d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 0.35);
      }
      // 1) white-noise burst
      var noise = actx.createBufferSource(); noise.buffer = buf;
      var nf = actx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 350;
      var ng = actx.createGain(); ng.gain.value = 1.0;
      noise.connect(nf); nf.connect(ng); ng.connect(actx.destination);
      noise.start(t);
      // 2) vocal shriek: bandpassed noise sweeping 2600 -> 420 Hz
      var vnoise = actx.createBufferSource(); vnoise.buffer = buf; vnoise.loop = true;
      var bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
      bp.frequency.setValueAtTime(2600, t);
      bp.frequency.exponentialRampToValueAtTime(420, t + dur);
      var vg = actx.createGain();
      vg.gain.setValueAtTime(1.0, t);
      vg.gain.setValueAtTime(1.0, t + dur*0.7);
      vg.gain.exponentialRampToValueAtTime(0.001, t + dur);
      vnoise.connect(bp); bp.connect(vg); vg.connect(actx.destination);
      vnoise.start(t); vnoise.stop(t + dur);
      // 3) detuned pitch-dropping saws through distortion
      var shaper = actx.createWaveShaper();
      var curve = new Float32Array(256);
      for (var k = 0; k < 256; k++){
        var x = k/128 - 1;
        curve[k] = Math.tanh(4*x);
      }
      shaper.curve = curve;
      var dg = actx.createGain(); dg.gain.value = 0.9;
      shaper.connect(dg); dg.connect(actx.destination);
      [170, 183, 340, 688, 1375].forEach(function(f){
        var o = actx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f*2.2, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(30, f*0.45), t + dur);
        var g = actx.createGain();
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(shaper);
        o.start(t); o.stop(t + dur);
      });
      // 4) sub-bass punch
      var sub = actx.createOscillator(); sub.type = 'sine';
      sub.frequency.setValueAtTime(120, t);
      sub.frequency.exponentialRampToValueAtTime(32, t + 0.9);
      var subg = actx.createGain();
      subg.gain.setValueAtTime(1.0, t);
      subg.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
      sub.connect(subg); subg.connect(actx.destination);
      sub.start(t); sub.stop(t + 1.2);
    }catch(e){}
  }

  function rnd(a, b){ return a + Math.random()*(b-a); }

  function drawFace(t){
    var W = cv.width, H = cv.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    var s = Math.min(W,H);
    var zoom = 1 + t*1.9;
    var jx = rnd(-14,14), jy = rnd(-14,14);
    ctx.save();
    ctx.translate(W/2 + jx, H*0.47 + jy);
    ctx.scale(zoom, zoom);
    ctx.rotate(rnd(-0.05, 0.05));
    ctx.translate(-W/2, -H*0.47);

    var cx = W/2, cy = H*0.47, hw = s*0.32, hh = s*0.44;

    // pale rotting head
    var g = ctx.createRadialGradient(cx, cy, s*0.04, cx, cy, s*0.52);
    g.addColorStop(0, '#d9d3c5'); g.addColorStop(0.65, '#a8a192'); g.addColorStop(1, '#2e2b28');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, hw, hh, 0, 0, 7); ctx.fill();

    // grime blotches
    ctx.fillStyle = 'rgba(40,36,32,0.35)';
    for (var i = 0; i < 14; i++){
      ctx.beginPath();
      ctx.ellipse(cx + rnd(-hw,hw)*0.8, cy + rnd(-hh,hh)*0.8, rnd(6,s*0.05), rnd(6,s*0.05), rnd(0,3), 0, 7);
      ctx.fill();
    }

    // hollow black eye sockets
    var ey = cy - hh*0.30, ex = hw*0.40;
    [-1,1].forEach(function(side){
      ctx.save();
      ctx.translate(cx + side*ex, ey);
      ctx.rotate(side * 0.28);
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(0, 0, hw*0.20, hh*0.125, 0, 0, 7); ctx.fill();
      // tiny white glint
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(rnd(-4,4), rnd(-4,4), Math.max(2, s*0.008), 0, 7); ctx.fill();
      ctx.restore();
      // angry brow slash
      ctx.strokeStyle = '#1c1a18'; ctx.lineWidth = Math.max(3, s*0.014); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx + side*ex - hw*0.24, ey - hh*0.20);
      ctx.lineTo(cx + side*ex + hw*0.20, ey - hh*0.10);
      ctx.stroke();
    });

    // nose slits
    ctx.fillStyle = '#141210';
    [-1,1].forEach(function(side){
      ctx.beginPath();
      ctx.ellipse(cx + side*hw*0.07, cy + hh*0.06, hw*0.035, hh*0.03, side*0.5, 0, 7);
      ctx.fill();
    });

    // HUGE screaming mouth, opens wider as t grows
    var my = cy + hh*0.44, mr = s*(0.085 + t*0.085);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(cx, my, hw*0.40, mr, 0, 0, 7); ctx.fill();
    // throat depth
    var tg = ctx.createRadialGradient(cx, my, 2, cx, my, mr);
    tg.addColorStop(0, '#000'); tg.addColorStop(1, '#3d0a0a');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.ellipse(cx, my, hw*0.40, mr, 0, 0, 7); ctx.fill();
    // jagged teeth
    ctx.fillStyle = '#e8e2d2';
    var teeth = 9;
    for (var k = 0; k < teeth; k++){
      var a = Math.PI * (k/(teeth-1)); // 0..PI across the top
      var tx = cx - Math.cos(a)*hw*0.36, ty = my - Math.sin(a)*mr*0.92;
      ctx.beginPath();
      ctx.moveTo(tx - hw*0.035, ty); ctx.lineTo(tx + hw*0.035, ty);
      ctx.lineTo(tx + rnd(-4,4), ty + rnd(mr*0.28, mr*0.5)); ctx.closePath(); ctx.fill();
      var bx = cx - Math.cos(a)*hw*0.36, by = my + Math.sin(a)*mr*0.92;
      ctx.beginPath();
      ctx.moveTo(bx - hw*0.035, by); ctx.lineTo(bx + hw*0.035, by);
      ctx.lineTo(bx + rnd(-4,4), by - rnd(mr*0.28, mr*0.5)); ctx.closePath(); ctx.fill();
    }

    // cracks
    ctx.strokeStyle = 'rgba(20,18,16,0.8)'; ctx.lineWidth = Math.max(2, s*0.006);
    for (var c = 0; c < 7; c++){
      var px = cx + rnd(-hw, hw)*0.9, py = cy - hh + rnd(0, hh*0.7);
      ctx.beginPath(); ctx.moveTo(px, py);
      for (var q = 0; q < 5; q++){ px += rnd(-18,18); py += rnd(8,30); ctx.lineTo(px, py); }
      ctx.stroke();
    }
    ctx.restore();

    // film grain
    for (var n = 0; n < 700; n++){
      var v = Math.floor(rnd(0,70));
      ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.5)';
      ctx.fillRect(rnd(0,W), rnd(0,H), rnd(1,3), rnd(1,3));
    }
    // red vignette pulse
    var vg = ctx.createRadialGradient(W/2,H/2, s*0.3, W/2,H/2, s*0.85);
    vg.addColorStop(0, 'rgba(160,0,0,0)');
    vg.addColorStop(1, 'rgba(160,0,0,' + (0.35 + 0.3*Math.abs(Math.sin(t*20))) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }

  function drawScareFrame(t){
    var W = cv.width, H = cv.height;
    if (faceImg){
      var zoom = 1 + t*1.9;
      var sc = Math.max(W/faceImg.width, H/faceImg.height) * zoom;
      var dw = faceImg.width*sc, dh = faceImg.height*sc;
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      ctx.drawImage(faceImg, W/2 - dw/2 + rnd(-14,14), H/2 - dh/2 + rnd(-14,14), dw, dh);
      for (var n = 0; n < 500; n++){
        var v = Math.floor(rnd(0,70));
        ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.4)';
        ctx.fillRect(rnd(0,W), rnd(0,H), 2, 2);
      }
    } else {
      drawFace(t);
    }
    // glitch slices
    if (Math.random() < 0.4){
      for (var k = 0; k < 3; k++){
        var y = rnd(0,H), h = rnd(8,60), dx = rnd(-60,60);
        try { ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); } catch(e){}
      }
    }
  }

  var scareTimer = null, flashTimer = null;

  function doScare(){
    scare.style.display = 'block';
    document.body.classList.add('shaking');
    stopAmbient();
    blast();
    if (navigator.vibrate){ try{ navigator.vibrate([500,120,500,120,900]); }catch(e){} }

    var t0 = performance.now(), DUR = 2600;
    var flashOn = false;
    flashTimer = setInterval(function(){
      flashOn = !flashOn;
      flash.style.opacity = flashOn ? rnd(0.25, 0.6) : 0;
    }, 90);

    (function frame(){
      var t = Math.min(1, (performance.now() - t0) / DUR);
      drawScareFrame(t);
      if (t < 1) requestAnimationFrame(frame);
    })();

    scareTimer = setTimeout(function(){
      clearInterval(flashTimer);
      flash.style.opacity = 0;
      document.body.classList.remove('shaking');
      after.style.display = 'flex';
    }, DUR + 400);
  }

  document.getElementById('playCard').addEventListener('click', function(){
    try {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e){}
    bait.classList.add('hidden');
    wait.classList.remove('hidden');
    startAmbient();
    // fake loading bar
    var p = 0;
    var barTimer = setInterval(function(){
      p = Math.min(92, p + rnd(4, 11));
      bar.style.width = p + '%';
    }, 450);
    // strike after 7–13 seconds, mid-"loading"
    var delay = 7000 + Math.random()*6000;
    setTimeout(function(){
      clearInterval(barTimer);
      bar.style.width = '100%';
      setTimeout(doScare, 350);
    }, delay);
  });

  document.getElementById('again').addEventListener('click', function(){
    location.reload();
  });
})();
</script>
</body>
</html>
